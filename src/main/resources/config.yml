# SellGUI – Konfiguration (Texte: MiniMessage)

economy:
  # auto = Vault, falls vorhanden, sonst give-command | vault | command
  mode: auto
  # >>> HIER den Befehl deines Wirtschafts-Plugins eintragen (Platzhalter: {player} {amount}) <<<
  give-command: "eco give {player} {amount}"

# true = nur "normale" Items ohne Namen/Verzauberung/Haltbarkeitsschaden werden gekauft
only-plain-items: true

gui:
  title: "<dark_green>Verkaufen"
  sell-name: "<green><bold>Verkaufen</bold> <gray>({amount}$)"
  sell-lore:
    - "<gray>Items in der Verkaufsfläche: <white>{count}"
    - "<gray>Wert: <green>{amount}$"
    - ""
    - "<yellow>Klicken zum Verkaufen"
  all-name: "<gold><bold>Alles verkaufen"
  all-lore:
    - "<gray>Verkauft alles Verkaufbare aus"
    - "<gray>deinem Inventar und der Fläche."
  cancel-name: "<red><bold>Abbrechen"
  cancel-lore:
    - "<gray>Schließt das Fenster."
    - "<gray>Du bekommst deine Items zurück."

messages:
  prefix: "<dark_gray>[<green>Verkauf</green>]</dark_gray> <gray>"
  sold: "{prefix}<white>{count}</white> Items für <green>{amount}$</green> verkauft."
  nothing: "{prefix}<red>Es gibt nichts Verkaufbares."
  failed: "{prefix}<red>Die Gutschrift hat nicht geklappt. Du behältst deine Items."
  players-only: "<red>Nur für Spieler."
  no-permission: "<red>Dazu hast du keine Berechtigung."
  reloaded: "{prefix}Preise neu geladen ({count} Items)."

# Preis pro Stück. Was hier nicht steht, kann nicht verkauft werden.
# Preis 0 oder Eintrag löschen = nicht verkaufbar.
